name: Sync iptv-org (diario)

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días 03:17 hora Argentina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sincronizar fuentes comunitarias (solo canales gratuitos, ver source-policy.json)
        run: python tools/sync_iptv_org.py
      - name: Tests
        run: node --test
      - name: Commit si hubo cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
          else
            git config user.name "andytv-bot"
            git config user.email "andytv-bot@users.noreply.github.com"
            git add channels.json channels.js app/src/main/assets/www/channels.json app/src/main/assets/www/channels.js
            git commit -m "chore: sync diario de fuentes iptv-org"
            git push
          fi
