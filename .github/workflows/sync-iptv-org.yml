name: Sync iptv-org (deshabilitado)

# La sincronización automática con listas comunitarias está deshabilitada.
# Las fuentes se curan a mano en channels.json. Se puede correr manualmente
# (python tools/sync_iptv_org.py --dry-run) solo para inspeccionar, sin escribir cambios.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspección (no escribe nada)
        run: python tools/sync_iptv_org.py --dry-run
